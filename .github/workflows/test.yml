name: Contract diff tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.23.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc -p tools/contract-diff-action/tsconfig.json
      - name: Install the pinned SOAP schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/paritydiff-xsd"
          "$RUNNER_TEMP/paritydiff-xsd/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r packages/detect/python/requirements.txt
          echo "XSD_PYTHON_BIN=$RUNNER_TEMP/paritydiff-xsd/bin/python" >> "$GITHUB_ENV"
      - run: pnpm exec vitest run --config tools/contract-diff-action/standalone-vitest.config.ts
        env:
          RUN_CONTRACT_DIFF_DOCKER: '1'
